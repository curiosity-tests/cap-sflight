# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI
run-name: "Node.js CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]
  schedule:
    - cron: 20 4 * * *


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i -g @sap/cds-dk typescript tsx
      - run: npm ci
      - run: npx cds-typer "*"
      - run: npm run lint
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
      - run: npm run build --if-present
      - run: npm run test
      - run: npm run test:mocha

      - name: Run integration tests - Manage Travels
        working-directory: ./app/travel_processor
        run: |
          npm run test:node -- --ci

      - name: Run integration tests - Analyze Bookings
        working-directory: ./app/travel_analytics
        run: |
          npm run test:node -- --ci

